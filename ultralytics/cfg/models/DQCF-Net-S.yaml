# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, WAD, []]
  - [-1, 2, HDC, [256, False, 0.25]]
  - [-1, 1, WAD, []]
  - [-1, 2, HDC, [512, False, 0.25]]
  - [-1, 1, WAD, []]
  - [-1, 2, HDC, [512, True]]
  - [-1, 1, WAD, []]
  - [-1, 2, HDC, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, SCA, [1024]] # 10

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, HDC, [512, False]] # 13
 
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, HDC, [256, False]] # 16 (P3/8-small)
 
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, HDC, [128, False]] # 19 (P2/4-xsmall)  # 小目标可以尝试将这里的False设置为True.
 
  - [-1, 1, CGB, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, HDC, [256, False]] # 22 (P3/8-small)
 
  - [-1, 1, CGB, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, HDC, [512, False]] # 25 (P4/16-medium)
 
  - [-1, 1, CGB, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, HDC, [1024, True]] # 28 (P5/32-large)
 
  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)





  


